name: Tests

# Tests du moteur de détection et du planificateur (pas de dépendance à Jellyfin).
on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Tests de détection et de rangement
        run: dotnet run --project Jellyfin.Plugin.MediaUploader.Tests -c Release
